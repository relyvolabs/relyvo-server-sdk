name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # The module has no dependencies, so there is no go.sum to cache.
          cache: false

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  go-examples:
    name: Go examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Build
        run: go build -o /tmp/relyvo-example .

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C sdk-ts run typecheck

      # The Go and TypeScript suites read the same spec/fixtures files, so a drifted
      # contract fails whichever language was not updated.
      - name: Test (includes conformance fixtures)
        run: pnpm -C sdk-ts test

      - name: Build
        run: pnpm -C sdk-ts run build

      - name: Typecheck the example against the built types
        run: pnpm -C examples/ts run typecheck

      - name: Verify the published file set
        run: pnpm -C sdk-ts run pack:check
