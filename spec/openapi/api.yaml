openapi: 3.1.0

info:
  title: Relyvo Developer Platform API
  version: 0.1.0
  summary: Foundation API for the Relyvo dashboard.
  description: |
    Identity, organization, project and API key management for the Relyvo
    dashboard.

    **Scope.** Real-time media (voice, video, chat, signalling) is not
    implemented. No endpoint in this document serves production media traffic.

    **Authentication.** Browser requests use an opaque, HttpOnly session cookie
    plus a CSRF header. Programmatic requests use an API key bearer token.

    **Error shape.** Every error returns `{ "error": { "code", "message",
    "request_id" } }`.
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Placeholder production origin

tags:
  - name: Health
  - name: Auth
  - name: Organizations
  - name: Members
  - name: Projects
  - name: API keys
  - name: Meetings
  - name: Playground
  - name: Entitlements
  - name: Billing
  - name: Internal chat
  - name: Internal metering
  - name: Programmatic

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required: [status]

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Verifies the API can reach PostgreSQL.
      security: []
      responses:
        "200":
          description: Ready to serve traffic
        "503":
          description: Database unreachable

  /v1/auth/google:
    get:
      tags: [Auth]
      summary: Start Google sign-in
      description: |
        Redirects to Google with PKCE, a signed state value and an OIDC nonce.
        Returns `503` when Google credentials are not configured.
      security: []
      responses:
        "302":
          description: Redirect to the Google consent screen
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OIDC callback
      description: |
        Validates state, exchanges the code and starts a session. Success
        redirects to the dashboard; failure redirects to `/login?error=<code>`.
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the dashboard or the login page

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current profile
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: The signed-in profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required: [user]
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/organizations:
    get:
      tags: [Organizations]
      summary: List organizations visible to the caller
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Organizations the caller belongs to
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                required: [organizations]
    post:
      tags: [Organizations]
      summary: Create an organization
      description: The creator becomes the initial owner.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                slug: { type: string, maxLength: 64, pattern: "^[a-z0-9-]+$" }
              required: [name, slug]
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /v1/organizations/{organizationID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Organizations]
      summary: Get an organization
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Organizations]
      summary: Update organization metadata
      description: Requires the `admin` or `owner` role.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
              required: [name]
      responses:
        "200":
          description: Organization updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{organizationID}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Members]
      summary: List members
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Members of the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{organizationID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: userID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Members]
      summary: Change a member role
      description: |
        Requires `admin` or `owner`. An organization must keep at least one
        owner, so demoting the final owner returns `409`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/Role"
              required: [role]
      responses:
        "204":
          description: Role updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Members]
      summary: Remove a member
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Member removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/projects:
    get:
      tags: [Projects]
      summary: List every project the caller can read
      description: |
        Cross-organization. The query joins organization memberships, so a project
        the caller cannot reach is never returned.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Visible projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                required: [projects]
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/projects/{projectID}/meetings:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [Meetings]
      summary: Create a shareable meeting
      description: |
        The server derives the room name and the join URL. Organization ownership,
        the host and the room name are never read from the request body.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting:
                    $ref: "#/components/schemas/Meeting"
                required: [meeting]
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    get:
      tags: [Meetings]
      summary: List a project's meetings
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Meetings, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  meetings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Meeting"
                required: [meetings]

  /v1/projects/{projectID}/playground/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [Playground]
      summary: Start a Playground session
      description: |
        Always private and short-lived, whatever the request says. Reuses the meeting
        row, admission rules and metering.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                mode: { type: string, enum: [video, audio] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Meeting"
                required: [session]
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/meetings/{meetingID}:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    get:
      tags: [Meetings]
      summary: Read meeting metadata
      description: |
        Public for a public meeting. A private meeting answers `404` to a caller who
        is not a member, so the endpoint cannot be used to discover that a meeting
        exists. `project_id` and `metadata` are only returned to an authorized view.
      security:
        - {}
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Safe meeting metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting:
                    $ref: "#/components/schemas/Meeting"
                required: [meeting]
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Meetings]
      summary: Update meeting settings
      description: Host or an organization developer and above.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                visibility: { type: string, enum: [public, private] }
                max_participants: { type: integer, minimum: 1, maximum: 10000 }
                require_approval: { type: boolean }
                passcode: { type: string, minLength: 4, maxLength: 128 }
                clear_passcode: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting:
                    $ref: "#/components/schemas/Meeting"
                required: [meeting]
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }

  /v1/meetings/{meetingID}/join:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    post:
      tags: [Meetings]
      summary: Join a meeting and receive a media token
      description: |
        No cookie is required. Admission is decided server-side from visibility, the
        passcode and the seat limit. When approval is required the response is `202`
        with a `join_secret` and **no** media block.
      security:
        - {}
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 128 }
                passcode: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "202":
          description: Waiting for host approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/meetings/{meetingID}/leave:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    post:
      tags: [Meetings]
      summary: Record a participant departure
      description: |
        Application state only. Billing follows verified media events, so this call
        cannot be used to avoid a charge, and repeating it is safe.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id: { type: string }
                join_secret: { type: string }
              required: [participant_id, join_secret]
      responses:
        "200":
          description: Recorded (or already recorded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id: { type: string }
                  admission_status: { type: string }
                  changed: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/meetings/{meetingID}/participants:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    get:
      tags: [Meetings]
      summary: List participants
      description: Host or an organization developer and above.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeetingParticipant"
                required: [participants]
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/meetings/{meetingID}/participants/{participantID}/admission:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
      - $ref: "#/components/parameters/ParticipantID"
    post:
      tags: [Meetings]
      summary: Poll admission state
      description: |
        The join secret is sent in the body, so it never appears in a URL or an
        access log. Once admitted, this returns the media block.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                join_secret: { type: string }
              required: [join_secret]
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /v1/meetings/{meetingID}/participants/{participantID}/admit:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
      - $ref: "#/components/parameters/ParticipantID"
    post:
      tags: [Meetings]
      summary: Admit a waiting participant
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Admitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant:
                    $ref: "#/components/schemas/MeetingParticipant"
                required: [participant]
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/meetings/{meetingID}/participants/{participantID}/reject:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
      - $ref: "#/components/parameters/ParticipantID"
    post:
      tags: [Meetings]
      summary: Reject a waiting participant
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant:
                    $ref: "#/components/schemas/MeetingParticipant"
                required: [participant]
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/meetings/{meetingID}/participants/{participantID}/remove:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
      - $ref: "#/components/parameters/ParticipantID"
    post:
      tags: [Meetings]
      summary: Remove a participant
      description: The host cannot be removed.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant:
                    $ref: "#/components/schemas/MeetingParticipant"
                required: [participant]
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/meetings/{meetingID}/end:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    post:
      tags: [Meetings]
      summary: End a meeting for everyone
      description: Idempotent. A terminal meeting never returns to active.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting:
                    $ref: "#/components/schemas/Meeting"
                required: [meeting]
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/playground/sessions/{sessionID}/join:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [Playground]
      summary: Join a Playground session
      description: Always requires membership of the owning organization.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /v1/playground/sessions/{sessionID}/leave:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [Playground]
      summary: Leave a Playground session
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id: { type: string }
                join_secret: { type: string }
              required: [participant_id, join_secret]
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id: { type: string }
                  changed: { type: boolean }

  /v1/meetings/{meetingID}/chat/session:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    post:
      tags: [Meetings]
      summary: Authorize an admitted participant for the meeting chat
      description: |
        Requires the participant's join secret. A meeting id is not a secret, so
        possession of the link grants nothing and a wrong secret answers 404 rather
        than confirming that the participant exists.

        The response carries no chat access token: those are signed by the chat
        service. This endpoint proves admission and reports what the participant
        may do.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id: { type: string }
                join_secret: { type: string }
              required: [participant_id, join_secret]
      responses:
        "200":
          description: Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingChatSession"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectID}/entitlements:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Entitlements]
      summary: Read the product entitlements of a project
      description: |
        A project with no entitlement row has nothing enabled. That is a valid
        state, so it answers 200 with everything false rather than 404.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Current entitlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements:
                    $ref: "#/components/schemas/ProjectEntitlements"
                required: [entitlements]
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Entitlements]
      summary: Update product entitlements
      description: |
        A patch: only the fields in the body change, so setting one policy value
        cannot reset the rest.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_enabled: { type: boolean }
                chat_enabled: { type: boolean }
                allow_public_channels: { type: boolean }
                max_message_bytes: { type: integer, minimum: 0 }
                max_channel_members: { type: integer, minimum: 0 }
                message_rate_per_minute: { type: integer, minimum: 0 }
                max_attachment_bytes: { type: integer, minimum: 0 }
                allowed_features:
                  type: array
                  items: { type: string }
                chat_retention:
                  type: string
                  enum: [project_default, meeting, persistent]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements:
                    $ref: "#/components/schemas/ProjectEntitlements"
                required: [entitlements]
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/v1/chat/projects/authorize:
    post:
      tags: [Internal chat]
      summary: Validate a project credential and return its chat policy
      description: |
        Service-only. The project is derived from the credential, so a caller can
        never name a project it holds no key for. Revocation is honoured
        immediately; there is no cache on this side.
      security:
        - serviceAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
              required: [api_key]
      responses:
        "200":
          description: Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatProjectAuthorization"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Chat is not enabled for this project (`chat_disabled`)

  /internal/v1/projects/{projectID}/chat-config:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Internal chat]
      summary: Read a project's chat policy
      description: |
        Used when the caller has an end-user token and therefore no project
        credential. Returns policy only: no secret, no credential metadata.
      security:
        - serviceAccount: []
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConfig"
        "403":
          description: Chat is not enabled for this project (`chat_disabled`)
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/v1/chat/developers/introspect:
    post:
      tags: [Internal chat]
      summary: Validate a dashboard session for the Playground
      description: |
        A developer may belong to several organizations, while the contract
        carries one `organization_id`. It is always chosen so that it owns every
        id in `project_ids`: `X-Relyvo-Project-ID` when readable, otherwise the
        earliest membership.
      security:
        - serviceAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  organization_id: { type: string, format: uuid }
                  project_ids:
                    type: array
                    items: { type: string, format: uuid }
                  name: { type: string }
                required: [user_id, organization_id, project_ids, name]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The account has no project to act in (`no_project`)

