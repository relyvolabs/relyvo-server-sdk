  /v1/api/whoami:
    get:
      tags: [Programmatic]
      summary: Resolve the calling API key
      description: |
        Authenticates with `Authorization: Bearer rv_<keyID>_<secret>`. A valid
        key is scoped to exactly one project.
      security:
        - apiKey: []
      responses:
        "200":
          description: The key's project context
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/api/video/config:
    get:
      tags: [Programmatic]
      summary: Public media connection details for the key's project
      description: |
        Returns the signalling URL and participant token lifetime. This is the
        same object a browser receives; it contains no secret, so it is only
        useful together with a token minted for the same project.

        The project is read from the API key, never from a path parameter.
      security:
        - apiKey: []
      responses:
        "200":
          description: Public connection details
          content:
            application/json:
              schema:
                type: object
                required: [livekit]
                properties:
                  livekit:
                    type: object
                    required: [server_url, token_ttl_seconds]
                    properties:
                      server_url:
                        type: string
                        format: uri
                        description: Browser-facing signalling URL.
                        example: wss://rtc.example.com
                      token_ttl_seconds:
                        type: integer
                        example: 900
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: This deployment has no media server configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
                example:
                  error:
                    code: livekit_not_configured
                    message: LiveKit is not configured on this deployment.

  /v1/api/video/tokens:
    post:
      tags: [Programmatic]
      summary: Mint a participant token for the key's project
      description: |
        The server-SDK surface: a trusted backend mints a media credential for its
        own user without a dashboard session.

        The grant is chosen here and is join-only. A caller cannot request
        `roomCreate`, `roomAdmin` or `roomList`, and cannot name a project: the
        project comes from the API key. Issuance goes through the same reservation
        and concurrency checks as the dashboard, so a token is only minted when the
        organization can pay for the session.

        Send `Content-Type: application/json`. The route authenticates with the
        bearer key, so no CSRF token is involved.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_name, participant_identity]
              properties:
                room_name:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
                participant_identity:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$"
                display_name:
                  type: string
                  maxLength: 128
                mode:
                  type: string
                  enum: [audio, video]
                  default: video
      responses:
        "200":
          description: A signed, join-only participant token
          content:
            application/json:
              schema:
                type: object
                required: [server_url, token, room_name, participant_identity, expires_at, mode, meter_code]
                properties:
                  server_url:
                    type: string
                    format: uri
                  token:
                    type: string
                    description: Short-lived LiveKit JWT. Send it to the browser.
                  room_name:
                    type: string
                  participant_identity:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  mode:
                    type: string
                    enum: [audio, video]
                  meter_code:
                    type: string
                    example: participant_seconds
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: The wallet cannot cover the initial reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          description: Too many concurrent sessions for the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: This deployment has no media server configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/billing/packages:
    get:
